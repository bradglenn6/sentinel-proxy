name: Sentinel Continuous Integration & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Required permissions for GitHub OIDC token minting
permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: 'gen-lang-client-0973854052'
  PROJECT_NUMBER: '798917645637'
  REGION: 'us-central1'
  SERVICE_NAME: 'sentinel-proxy'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/798917645637/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
  SERVICE_ACCOUNT: 'sentinel-cicd-deployer@gen-lang-client-0973854052.iam.gserviceaccount.com'

jobs:
  # -----------------------------------------------------------
  # Stage 1: Validation & Latency Gate
  # -----------------------------------------------------------
  validate:
    name: Lint, Test & Latency SLA Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Compile TypeScript
        run: npm run build

      - name: Execute In-Memory Latency SLA Gate (<= 4.0ms)
        run: node benchmark/engine_test.js

  # -----------------------------------------------------------
  # Stage 2: Deploy to Google Cloud Run (Main branch only)
  # -----------------------------------------------------------
  deploy:
    name: Deploy to Cloud Run (WIF)
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # Exchange GitHub OIDC token for short-lived GCP credentials
      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Deploy directly from source via Cloud Build
      - name: Deploy Revision to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars UPSTREAM_LLM_URL="https://generativelanguage.googleapis.com" \
            --quiet

      # Post-deployment live edge smoke test
      - name: Live Endpoint Smoke Test
        run: |
          echo "Waiting 5 seconds for edge routing sync..."
          sleep 5
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://sentinel.zrolabz.com/healthz)
          echo "Endpoint status: $STATUS_CODE"
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Smoke test failed! Expected HTTP 200 from https://sentinel.zrolabz.com/healthz"
            exit 1
          fi
          echo "Smoke test passed cleanly!"
