[package]
name = "xero-core"
version = "0.1.0"
edition = "2021"
authors = ["Bradley Jones <dev@zrolabz.com>"]
description = "Autonomous agent drift detection, socket isolation, and runtime recovery engine"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4.3"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "xero_latency_bench"
harness = false

[[bin]]
name = "xero-benchmark"
path = "src/main.rs"
