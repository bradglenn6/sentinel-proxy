[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerolabz-sentinel"
version = "1.0.0"
description = "Zero-latency AI security guardrail and proxy client SDK"
authors = [{ name = "ZeroLabz" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
