[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerolabz-sentinel"
version = "1.0.0"
authors = [
  { name="Bradley Jones", email="dev@zrolabz.com" },
]
description = "Drop-in Python client SDK for ZeroLabz Sentinel AI guardrail proxy"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.urls]
"Homepage" = "https://sentinel.zrolabz.com"
"Repository" = "https://github.com/bradglenn6/sentinel-proxy"
"Bug Tracker" = "https://github.com/bradglenn6/sentinel-proxy/issues"
