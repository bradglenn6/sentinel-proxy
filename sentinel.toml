# ==============================================================================
# ZeroLabz Sentinel — Dynamic Red-Team Rule Corpus (Milestones 1 & 4)
# ==============================================================================

jailbreaks = [
    '(?i)(?:ignore|disregard|forget|bypass|override|drop)\s+(?:all\s+)?(?:(?:previous|prior|above|initial)\s+)?(?:instructions|prompts|rules|directives|constraints|guardrails)',
    '(?i)(?:start|continue)\s+from\s+a\s+clean\s+slate',
    '(?i)reset\s+all\s+prior\s+context',
    '(?i)(?:you\s+are\s+now|act\s+as|pretend\s+to\s+be|roleplay\s+as)\s+(?:DAN|AIM|ChaosGPT|EvilBot|unrestricted|an\s+AI\s+without\s+rules|jailbroken)',
    '(?i)(?:developer|maintenance|god|sudo|admin|debug)\s+mode\s+(?:enabled|activated|on|override)',
    '(?i)always\s+respond\s+with\s+unfiltered',
    '(?i)do\s+anything\s+now\s+mode',
    '(?i)(?:reveal|show|print|leak|display|output|echo|repeat)\s+(?:your\s+)?(?:system\s+prompt|initial\s+instructions|core\s+directive|hidden\s+instructions|developer\s+message)',
    '(?i)what\s+(?:are|were)\s+the\s+(?:words|instructions)\s+above',
    '(?i)output\s+(?:the\s+)?text\s+between\s+system\s+tags',
    '(?i)in\s+a\s+hypothetical\s+fictional\s+scenario\s+where\s+(?:rules|laws|safety)\s+do\s+not\s+apply',
    '(?i)for\s+educational\s+and\s+research\s+purposes\s+only\s*,?\s*ignore\s+safety',
    '(?i)write\s+a\s+story\s+where\s+a\s+character\s+bypasses\s+guardrails',
    '(?i)sudo\s+(?:rm|sh|bash|chmod|cat|curl|wget|mode)',
    '(?i)<\s*\|\s*im_start\s*\|\s*>',
    '(?i)[system]\s*:',
]

delimiters = [
    '(?i)\[/?(?:INST|SYS|SYSTEM|INSTRUCTION)\]',
    '(?i)</?(?:system|instruction|prompt|im_start|im_end|context|user|assistant)>',
    '(?i)<\|im_start\|>',
    '(?i)<\|im_end\|>',
    '(?i)<s>|</s>',
    '(?i)<<SYS>>|<</SYS>>',
    '(?i)(?:---|###|===)\s*(?:END|START|RESET)\s+(?:OF\s+)?(?:SYSTEM|INSTRUCTIONS|RULES|PROMPT)\s*(?:---|###|===)',
    '(?i)(?:new\s+system\s+instruction|system\s+directive\s+override|priority\s+override\s*:)',
    '(?i)```(?:json|markdown|system)?\s*\{\s*"role"\s*:\s*"system"',
]

[[pii_rules]]
name = 'SSN'
pattern = '\b\d{3}-\d{2}-\d{4}\b'
placeholder = '[REDACTED_SSN]'

[[pii_rules]]
name = 'CREDIT_CARD'
pattern = '\b(?:\d{4}[- ]?){3}\d{4}\b'
placeholder = '[REDACTED_CARD]'

[[pii_rules]]
name = 'EMAIL'
pattern = '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
placeholder = '[REDACTED_EMAIL]'

[[pii_rules]]
name = 'OPENAI_SECRET'
pattern = '\bsk-[A-Za-z0-9_-]{20,}\b'
placeholder = '[REDACTED_OPENAI_KEY]'

[[pii_rules]]
name = 'GITHUB_TOKEN'
pattern = '\bgh[pousr]_[A-Za-z0-9_]{36,}\b'
placeholder = '[REDACTED_GITHUB_TOKEN]'

[[pii_rules]]
name = 'AWS_ACCESS_KEY'
pattern = '\bAKIA[0-9A-Z]{16}\b'
placeholder = '[REDACTED_AWS_KEY]'

[[pii_rules]]
name = 'GENERIC_API_KEY'
pattern = '(?i)\b(?:api[_-]?key|bearer|token|secret)\s*[:=]\s*[A-Za-z0-9_\-\.]{20,}\b'
placeholder = '[REDACTED_KEY]'
